<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>DevTech Academy</title>
</head>

<body>
  <form id="form-aluno">
    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome">

    <label for="idade">Idade</label>
    <input type="number" id="idade" name="idade">

    <label for="curso">Curso</label>
    <select name="curso" id="curso">
      <option value="javascript">Javascript</option>
      <option value="python">Python</option>
      <option value="java">Java</option>
    </select>

    <label for="notafinal">Nota Final</label>
    <input type="number" id="notafinal" name="notafinal">

    <button type="submit">Cadastrar</button>

  </form>

  <table cellpadding="5" cellspacing="0">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Idade</th>
        <th>Curso</th>
        <th>Nota Final</th>
        <th>Situação</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabela-alunos">
    </tbody>
  </table>

  <h2>Relatórios</h2>
  <button id="btnAprovados">Aprovados</button>
  <button id="btnMediaNotas">Média das Notas</button>
  <button id="btnMediaIdades">Média das Idades</button>
  <button id="btnOrdem">Nomes em ordem alfabética</button>
  <button id="btnPorCurso">Alunos por curso</button>
  <p id="resultado"></p>

  <script src="./script.js"></script>
</body>

</html>
