<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevTech Academy</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Fontes (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <!-- Seu CSS: sempre DEPOIS do Bootstrap -->
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="container py-4 py-lg-5">
    <div class="pagina">

      <!-- Abas laterais (ficam "coladas" na direita do caderno) -->
      <ul class="nav flex-lg-column abas" id="abas" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#aba-alunos" type="button" role="tab">Alunos</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="pill" data-bs-target="#aba-relatorios" type="button" role="tab">Relatórios</button>
        </li>
      </ul>

      <!-- Caderno -->
      <div class="caderno">

        <div class="barra-janela">
          <span class="barra-titulo">devtech_academy.exe</span>
          <div class="barra-botoes" aria-hidden="true">
            <span class="barra-btn">–</span>
            <span class="barra-btn">□</span>
            <span class="barra-btn">×</span>
          </div>
        </div>

        <header class="caderno-topo d-flex justify-content-between align-items-center">
          <h1 class="titulo">DevTech Academy ☆</h1>
          <small class="contador">TOTAL <span id="statTopo">0</span></small>
        </header>

        <div class="row g-4">

          <!-- Painel esquerdo: "perfil" da escola -->
          <aside class="col-lg-4">
            <div class="perfil">
              <div class="foto"><img src="./img/ペンを持ってメモを書いている三毛猫のイラスト.jpg" alt="gato professor"></div>

              <ul class="list-unstyled estatisticas font-retro">
                <li><span>Alunos</span> <strong id="statTotal">0</strong></li>
                <li><span>Aprovados</span> <strong id="statAprovados">0</strong></li>
                <li><span>Média das notas</span> <strong id="statMedia">0.00</strong></li>
              </ul>
            </div>
          </aside>

          <!-- Conteúdo: muda conforme a aba -->
          <section class="col-lg-8">
            <div class="tab-content">

              <!-- ABA 1: cadastro + tabela -->
              <div class="tab-pane fade show active" id="aba-alunos" role="tabpanel">
                <h2 class="secao">Novo aluno</h2>

                <form id="form-aluno" class="row g-3">
                  <div class="col-md-8">
                    <label for="nome" class="form-label font-retro">Nome</label>
                    <input type="text" class="form-control" id="nome" name="nome">
                  </div>
                  <div class="col-md-4">
                    <label for="idade" class="form-label font-retro">Idade</label>
                    <input type="number" class="form-control" id="idade" name="idade">
                  </div>
                  <div class="col-md-8">
                    <label for="curso" class="form-label font-retro">Curso</label>
                    <select class="form-select" name="curso" id="curso">
                      <option value="Javascript">Javascript</option>
                      <option value="Python">Python</option>
                      <option value="Java">Java</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label for="notafinal" class="form-label font-retro">Nota Final</label>
                    <input type="number" class="form-control" id="notafinal" name="notafinal" step="0.1" min="0" max="10">
                  </div>
                  <div class="col-12">
                    <button type="submit" class="btn btn-principal">Cadastrar</button>
                  </div>
                </form>

                <h2 class="secao mt-4">Lista de alunos</h2>
                <div class="table-responsive">
                  <table class="table table-sm align-middle tabela">
                    <thead>
                      <tr>
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>Curso</th>
                        <th>Nota Final</th>
                        <th>Situação</th>
                        <th>Ações</th>
                      </tr>
                    </thead>
                    <tbody id="tabela-alunos"></tbody>
                  </table>
                </div>
              </div>

              <!-- ABA 2: relatórios -->
              <div class="tab-pane fade" id="aba-relatorios" role="tabpanel">
                <h2 class="secao">Relatórios</h2>
                <div class="d-flex flex-wrap gap-2 mb-3">
                  <button class="btn btn-outline-principal" id="btnAprovados">Aprovados</button>
                  <button class="btn btn-outline-principal" id="btnMediaNotas">Média das Notas</button>
                  <button class="btn btn-outline-principal" id="btnMediaIdades">Média das Idades</button>
                  <button class="btn btn-outline-principal" id="btnOrdem">Nomes em ordem alfabética</button>
                  <button class="btn btn-outline-principal" id="btnPorCurso">Alunos por curso</button>
                </div>
                <div id="resultado" class="caixa-resultado">Escolha um relatório acima ☆</div>
              </div>

            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS (necessário para as abas) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./script.js"></script>
</body>

</html>
